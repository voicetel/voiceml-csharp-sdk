name: Publish to NuGet

# Publishes the VoiceML NuGet package to nuget.org on every v* tag push.
# Uses OIDC trusted publishing — no long-lived API key stored as a secret.
#
# One-time setup at https://www.nuget.org/account/trusted-publishing :
#   Repository Owner: voicetel
#   Repository:       voiceml-csharp-sdk
#   Workflow File:    publish.yml
#   Environment:      (leave blank)
#   Package Owner:    <nuget.org username>
#
# `NuGet/login@v1` trades the GitHub OIDC token for a 1-hour API key.
# `--skip-duplicate` keeps the publish idempotent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Pack (nupkg + snupkg)
        run: dotnet pack -c Release --no-build -o packages

      - name: List packed artifacts
        run: ls -la packages/

      - name: Authenticate to nuget.org via OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: voicetel

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
