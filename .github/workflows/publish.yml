name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (must match the project version)
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - run: dotnet build examples/Quickstart/Quickstart.csproj -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(dotnet msbuild src/VoiceML/VoiceML.csproj -getProperty:Version)
          test "$RELEASE_TAG" = "v$version"
      - name: Pack library and symbols
        run: dotnet pack -c Release -o packages
      - name: Authenticate to nuget.org via trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The nuget.org trusted-publishing policy must be owned by exactly this
          # user, not merely by the GitHub organization or package co-owner.
          # Set the repository variable to the policy creator's nuget.org username.
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
