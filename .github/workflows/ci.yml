name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release -f ${{ matrix.framework }}
      - run: dotnet build examples/Quickstart/Quickstart.csproj -c Release -f ${{ matrix.framework }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet list package --vulnerable --include-transitive

  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack -c Release -o packages
      - name: Verify package license, target assets and fixture exclusion
        run: |
          python3 - <<'PY'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('packages/*.nupkg')[0]) as package:
              names = package.namelist()
              assert 'LICENSE' in names
              assert 'lib/net8.0/VoiceML.dll' in names
              assert 'lib/net10.0/VoiceML.dll' in names
              assert not any('fixture' in n.lower() or 'openapi' in n.lower() for n in names)
          PY
      - name: Local-feed installation smoke test
        run: |
          dotnet new console -n Smoke -o "$RUNNER_TEMP/voiceml-smoke" -f net10.0
          dotnet add "$RUNNER_TEMP/voiceml-smoke/Smoke.csproj" package VoiceML --version 0.9.3 --source "$GITHUB_WORKSPACE/packages"
          dotnet build "$RUNNER_TEMP/voiceml-smoke/Smoke.csproj" -c Release -warnaserror
